<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Divicheck GUI</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #1e1e1e;
      color: #cccccc;
      height: 100vh;
      overflow: hidden;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }
    .sticky-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #1e1e1e;
      padding-top: 0;
      padding-bottom: 5px;
      margin-top: 0;
      flex-shrink: 0;
    }

    .stats-card {
      background: #252526;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      border: 1px solid #333333;
    }
    divi-table {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }
    .table-container {
      background: #252526;
      border-radius: 8px;
      border: 1px solid #333333;
      overflow: auto;
      width: 100%;
      flex: 1;
      min-height: 0;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 13px;
    }
    th, td {
      padding: 10px 14px;
      border-bottom: 1px solid #333333;
      border-right: 1px solid #2d2d2d;
    }
    thead {
      position: sticky;
      top: 0;
      z-index: 3;
    }
    th {
      background: #2d2d2d;
      font-weight: 600;
      color: #ffffff;
      border-bottom: 2px solid #3f3f46;
    }
    tr:hover {
      background: #2a2d2e;
    }
    .loading {
      color: #858585;
      font-style: italic;
      padding: 20px;
    }
    .tab-panel {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 1px solid #333333;
      padding-bottom: 10px;
    }
    .tab-btn {
      background: #2d2d2d;
      color: #cccccc;
      border: 1px solid #333333;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
    }
    .tab-btn.active {
      background: #0e639c;
      color: #ffffff;
      border-color: #1177bb;
    }
    .view-content {
      display: none;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }
    .view-content.active {
      display: flex;
    }
    .stats-card table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .stats-card td {
      padding: 6px 10px;
      border-bottom: 1px solid #333333;
      border-right: none;
      color: #cccccc;
    }
    .stats-card tr:last-child td {
      border-bottom: none;
    }
    /* Scrollbars dark mode */
    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }
    ::-webkit-scrollbar-track {
      background: #1e1e1e;
    }
    ::-webkit-scrollbar-thumb {
      background: #424242;
      border-radius: 5px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #4f4f4f;
    }
    .analysis-top-panel {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      background: #1e1e1e;
      padding-top: 0;
      padding-bottom: 10px;
      margin-bottom: 20px;
      box-sizing: border-box;
    }
    .analysis-top-panel .stats-card {
      flex: 1;
      min-width: 320px;
      margin-bottom: 0;
    }
  </style>
  <script src="./node_modules/chart.js/dist/chart.umd.js"></script>
</head>
<body>
  <div class="sticky-header">
    <div class="tab-panel">
      <button class="tab-btn active" onclick="switchView('analysis')">analysis</button>
      <button class="tab-btn" onclick="switchView('search')">search</button>
    </div>
  </div>

  <div id="view-search" class="view-content">
    <div class="stats-card" id="stats-summary">
      <span class="loading">Loading stats...</span>
    </div>

    <divi-table id-prefix="search" legend="in portfolio" legend-color="#10b981"></divi-table>
  </div>

  <div id="view-analysis" class="view-content active">
    <div id="sticky-analysis-panel" class="analysis-top-panel">
      <div class="stats-card" id="analysis-summary">
        <span class="loading">Loading analysis...</span>
      </div>
      <div class="stats-card" style="display: flex; flex-direction: column; justify-content: center; align-items: center;">
        <div style="width: 100%; height: 180px; position: relative;">
          <canvas id="sectorPieChart"></canvas>
        </div>
      </div>
    </div>

    <divi-table id-prefix="analysis" legend="DB filtered by stable dividend filter"></divi-table>
  </div>

  <script>
    class DiviTable extends HTMLElement {
      connectedCallback() {
        const idPrefix = this.getAttribute('id-prefix') || 'table';
        const legendText = this.getAttribute('legend') || '';
        const legendColor = this.getAttribute('legend-color') || '#facc15';

        this.innerHTML = `
          <div class="table-container">
            <table>
              <thead>
                <tr style="${legendText ? '' : 'display:none;'}">
                  <td colspan="100" style="background: #252526; color: #cccccc; padding: 10px 14px; border-bottom: 1px solid #333333;">
                    <div style="display: flex; align-items: center; gap: 8px;">
                      <span style="display: inline-block; width: 14px; height: 14px; background: ${legendColor}; border-radius: 2px; flex-shrink: 0;"></span>
                      <span id="${idPrefix}-legend-text">${legendText}</span>
                    </div>
                  </td>
                </tr>
                <tr id="${idPrefix}-header"></tr>
              </thead>
              <tbody id="${idPrefix}-body">
                <tr><td class="loading">Loading...</td></tr>
              </tbody>
            </table>
          </div>
        `;
      }

      updateStickyHeader() {}
    }
    customElements.define('divi-table', DiviTable);

    function switchView(viewName) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.view-content').forEach(view => view.classList.remove('active'));

      if (viewName === 'analysis') {
        document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
        document.getElementById('view-analysis').classList.add('active');
        loadAnalysis();
      } else if (viewName === 'search') {
        document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
        document.getElementById('view-search').classList.add('active');
        loadData();
      }
    }

    async function loadAnalysis() {
      try {
        const stats = await window.api.getPortfolioStats();

        document.getElementById('analysis-summary').innerHTML = `
          <table>
            <tr><td><strong>Number of Holdings:</strong></td><td>${stats.holdings.length}</td></tr>
            <tr><td><strong>Total Holdings Value:</strong></td><td>$${stats.total_holdings_value}</td></tr>
            <tr><td><strong>Average Dividend Yield:</strong></td><td>${stats.average_dividend_yield}%</td></tr>
            <tr><td><strong>Expected Total Yearly Dividend:</strong></td><td>$${stats.expected_total_yearly_dividend}</td></tr>
            <tr><td><strong>Expected Monthly Dividend:</strong></td><td>$${stats.expected_monthly_dividend}</td></tr>
          </table>
        `;

        const theadTr = document.getElementById('analysis-header');
        if (theadTr) {
          theadTr.innerHTML = `
            <th>Symbol</th>
            <th>Company</th>
            <th>Shares</th>
            <th>Price ($)</th>
            <th>Holding Value ($)</th>
            <th>Yearly Dividend ($)</th>
            <th>Yield (%)</th>
          `;
        }

        const tbody = document.getElementById('analysis-body');
        if (!stats.holdings || stats.holdings.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7">No holdings found! check .app/portfolio.json</td></tr>';
          return;
        }

        tbody.innerHTML = stats.holdings.map(h => `
          <tr ${h.db_filtered ? 'style="color: #facc15;"' : ''}>
            <td>${h.symbol}</td>
            <td>${h.company}</td>
            <td>${h.shares}</td>
            <td>$${h.price}</td>
            <td>$${h.holding_value}</td>
            <td>$${h.yearly_dividend}</td>
            <td>${h.yield_1y}%</td>
          </tr>
        `).join('');

        const ctx = document.getElementById('sectorPieChart').getContext('2d');
        if (window.sectorChartInstance) {
          window.sectorChartInstance.destroy();
        }

        const sectorColors = [
          '#4f46e5', '#06b6d4', '#10b981', '#f59e0b', '#ef4444',
          '#ec4899', '#8b5cf6', '#3b82f6', '#14b8a6', '#84cc16',
          '#f97316', '#6366f1'
        ];

        window.sectorChartInstance = new Chart(ctx, {
          type: 'pie',
          data: {
            labels: stats.sectors.labels,
            datasets: [{
              data: stats.sectors.values,
              backgroundColor: sectorColors.slice(0, stats.sectors.labels.length),
              borderWidth: 1,
              borderColor: '#252526'
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                position: 'right',
                labels: {
                  color: '#cccccc',
                  boxWidth: 12,
                  font: {
                    size: 13
                  }
                }
              },
              tooltip: {
                callbacks: {
                  label: function(context) {
                    const label = context.label || '';
                    const value = context.parsed || 0;
                    const total = context.dataset.data.reduce((a, b) => a + b, 0);
                    const pct = total > 0 ? ((value / total) * 100).toFixed(1) : 0;
                    return ` ${label}: $${value.toFixed(2)} (${pct}%)`;
                  }
                }
              }
            }
          }
        });
        document.querySelectorAll('divi-table').forEach(dt => dt.updateStickyHeader());
      } catch (err) {
        document.getElementById('analysis-summary').innerHTML = `<span style="color: red;">Error: ${err.message}</span>`;
        document.getElementById('analysis-body').innerHTML = `<tr><td colspan="7" style="color: red;">Failed to load portfolio analysis</td></tr>`;
      }
    }

    async function loadData() {
      try {
        const stats = await window.api.getStats();

        document.getElementById('stats-summary').innerHTML = `
          <table>
            <tr><td><strong>Database:</strong></td><td>${stats.db_path}</td></tr>
            <tr><td><strong>Size:</strong></td><td>${stats.file_size} bytes</td></tr>
            <tr><td><strong>Total Rows:</strong></td><td>${stats.total_rows}</td></tr>
            <tr><td><strong>Symbols Source:</strong></td><td>${stats.source} (${stats.rows.length} matching)</td></tr>
          </table>
        `;

        const theadTr = document.getElementById('search-header');
        const tbody = document.getElementById('search-body');

        if (stats.rows.length === 0) {
          theadTr.innerHTML = '<th>Symbol</th>';
          tbody.innerHTML = '<tr><td colspan="1">No matching rows found.</td></tr>';
          return;
        }

        const columns = Object.keys(stats.rows[0]);
        const colInfo = stats.col_info || {};
        const portfolioSymbols = new Set((stats.portfolio_symbols || []).map(s => s.toUpperCase()));

        theadTr.innerHTML = columns.map(col => {
          const desc = colInfo[col] || col;
          return `<th title="${desc}">${col}</th>`;
        }).join('');

        tbody.innerHTML = stats.rows.map(r => {
          const sym = (r.SYMBOL !== undefined ? r.SYMBOL : r[columns[0]]) || '';
          const isInPortfolio = portfolioSymbols.has(String(sym).toUpperCase());
          return `
            <tr ${isInPortfolio ? 'style="color: #10b981;"' : ''}>
              ${columns.map(col => {
                const desc = colInfo[col] || '';
                return `<td title="${desc}">${r[col] !== null && r[col] !== undefined ? r[col] : ''}</td>`;
              }).join('')}
            </tr>
          `;
        }).join('');
        document.querySelectorAll('divi-table').forEach(dt => dt.updateStickyHeader());
      } catch (err) {
        document.getElementById('stats-summary').innerHTML = `<span style="color: red;">Error: ${err.message}</span>`;
        document.getElementById('search-body').innerHTML = `<tr><td colspan="1" style="color: red;">Failed to data</td></tr>`;
      }
    }

    window.addEventListener('resize', () => {
      document.querySelectorAll('divi-table').forEach(dt => dt.updateStickyHeader());
    });

    window.onload = async () => {
      while (!window.api || !window.api.getPortfolioStats) {
        await new Promise(r => setTimeout(r, 50));
      }
      loadAnalysis();
    };
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Divicheck GUI</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./node_modules/chart.js/dist/chart.umd.js"></script>
</head>
<body>
  <div class="sticky-header">
    <div class="tab-panel">
      <button class="tab-btn active" onclick="switchView('analysis')">Analysis</button>
      <button class="tab-btn" onclick="switchView('search')">Search</button>
    </div>
    <div id="db-missing-banner" class="db-warning" style="display: none; margin-bottom: 12px;">Database not available — no market data. Click Update to build it.</div>
  </div>

  <div id="view-search" class="view-content">
    <div class="stats-card" id="stats-summary">
      <span class="loading">Loading stats...</span>
    </div>

    <divi-table id-prefix="search" legend="In portfolio" legend-color="#10b981"></divi-table>
  </div>

  <div id="view-analysis" class="view-content active">
    <div id="sticky-analysis-panel" class="analysis-top-panel">
      <div class="stats-card" id="analysis-summary">
        <span class="loading">Loading analysis...</span>
        <div style="display: flex; align-items: center; justify-content: flex-start; gap: 10px; margin-top: 15px; padding-top: 12px; border-top: 1px solid #333333;">
          <button id="open-portfolio-btn" class="tab-btn" style="padding: 6px 14px; font-size: 13px; background: #0e639c; color: white; cursor: pointer;">Open</button>
          <button id="update-portfolio-btn" class="tab-btn" style="padding: 6px 14px; font-size: 13px; background: #0e639c; color: white; cursor: pointer;">Update</button>
        </div>
      </div>
      <div class="stats-card" style="display: flex; flex-direction: column; justify-content: flex-start; align-items: stretch; position: relative;">
        <div style="font-weight: 600; margin-bottom: 8px; color: #ffffff; text-align: left; font-size: 13px;">Sector Chart</div>
        <div style="width: 100%; height: 210px; position: relative;">
          <canvas id="sectorPieChart"></canvas>
          <div id="pie-no-data-msg" style="position: absolute; display: none; align-items: center; justify-content: center; top: 0; left: 0; width: 100%; height: 100%; color: #858585; font-style: italic; background: rgba(25,25,25,0.9);">No data</div>
        </div>
      </div>
    </div>

    <divi-table id-prefix="analysis" legend="Not in database,Filtered by stable dividend filter" legend-color="#ef4444,#facc15" legend-key="missing,filtered"></divi-table>
  </div>

  <div id="db-task-bar" class="db-task-bar hidden">
    <div class="db-task-title" id="db-task-title">Portfolio update</div>
    <div class="db-task-progress">
      <div class="db-task-fill" id="db-task-fill"></div>
    </div>
    <div class="db-task-text" id="db-task-text"></div>
    <button id="db-task-stop-btn" class="tab-btn" style="padding: 4px 12px; font-size: 12px; background: #a4262c; color: white; border: none; cursor: pointer;">Stop</button>
  </div>

  <div id="popup-modal" class="modal" style="display: none;">
    <div class="modal-content">
      <div id="popup-title" style="font-weight: 600; color: #ffffff; font-size: 14px; border-bottom: 1px solid #333333; padding-bottom: 8px; margin-bottom: 5px;">Error</div>
      <textarea id="popup-message" readonly></textarea>
      <button id="popup-ok-btn" class="tab-btn" style="align-self: flex-end;">OK</button>
    </div>
  </div>

  <script type="module" src="./renderer.js"></script>
</body>
</html>

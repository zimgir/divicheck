<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Divicheck GUI</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #1e1e1e;
      color: #cccccc;
      height: 100vh;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 10px;
      color: #ffffff;
      flex-shrink: 0;
    }
    .stats-card {
      background: #252526;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      border: 1px solid #333333;
      flex-shrink: 0;
    }
    .table-container {
      background: #252526;
      border-radius: 8px;
      border: 1px solid #333333;
      flex: 1;
      min-height: 0;
      overflow-x: scroll;
      overflow-y: auto;
      width: 100%;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 13px;
    }
    th, td {
      padding: 10px 14px;
      border-bottom: 1px solid #333333;
      border-right: 1px solid #2d2d2d;
    }
    th {
      background: #2d2d2d;
      position: sticky;
      top: 0;
      z-index: 2;
      font-weight: 600;
      color: #ffffff;
      border-bottom: 2px solid #3f3f46;
    }
    tr:hover {
      background: #2a2d2e;
    }
    .loading {
      color: #858585;
      font-style: italic;
      padding: 20px;
    }
    .tab-panel {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 1px solid #333333;
      padding-bottom: 10px;
      flex-shrink: 0;
    }
    .tab-btn {
      background: #2d2d2d;
      color: #cccccc;
      border: 1px solid #333333;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
    }
    .tab-btn.active {
      background: #0e639c;
      color: #ffffff;
      border-color: #1177bb;
    }
    .view-content {
      display: none;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }
    .view-content.active {
      display: flex;
    }
    .stats-card table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .stats-card td {
      padding: 6px 10px;
      border-bottom: 1px solid #333333;
      border-right: none;
      color: #cccccc;
    }
    .stats-card tr:last-child td {
      border-bottom: none;
    }
    /* Scrollbars dark mode */
    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }
    ::-webkit-scrollbar-track {
      background: #1e1e1e;
    }
    ::-webkit-scrollbar-thumb {
      background: #424242;
      border-radius: 5px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #4f4f4f;
    }
  </style>
</head>
<body>
  <h1>Divicheck Dashboard</h1>
  <div class="tab-panel">
    <button class="tab-btn active" onclick="switchView('search')">search</button>
    <button class="tab-btn" onclick="switchView('analysis')">analysis</button>
  </div>

  <div id="view-search" class="view-content active">
    <div class="stats-card" id="stats-summary">
      <span class="loading">Loading stats...</span>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr id="table-header"></tr>
        </thead>
        <tbody id="table-body">
          <tr><td class="loading">Loading symbols data...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div id="view-analysis" class="view-content">
    <div class="stats-card" id="analysis-summary">
      <span class="loading">Loading analysis...</span>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Symbol</th>
            <th>Company</th>
            <th>Shares</th>
            <th>Price ($)</th>
            <th>Holding Value ($)</th>
            <th>Yearly Dividend ($)</th>
            <th>Yield (%)</th>
          </tr>
        </thead>
        <tbody id="analysis-table-body">
          <tr><td colspan="7" class="loading">Loading portfolio...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    function switchView(viewName) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.view-content').forEach(view => view.classList.remove('active'));

      if (viewName === 'search') {
        document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
        document.getElementById('view-search').classList.add('active');
      } else if (viewName === 'analysis') {
        document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
        document.getElementById('view-analysis').classList.add('active');
        loadAnalysis();
      }
    }

    async function loadAnalysis() {
      try {
        const stats = await window.api.getPortfolioStats();

        document.getElementById('analysis-summary').innerHTML = `
          <table>
            <tr><td><strong>Number of Holdings:</strong></td><td>${stats.holdings.length}</td></tr>
            <tr><td><strong>Total Holdings Value:</strong></td><td>$${stats.total_holdings_value}</td></tr>
            <tr><td><strong>Average Dividend Yield:</strong></td><td>${stats.average_dividend_yield}%</td></tr>
            <tr><td><strong>Expected Total Yearly Dividend:</strong></td><td>$${stats.expected_total_yearly_dividend}</td></tr>
            <tr><td><strong>Expected Monthly Dividend:</strong></td><td>$${stats.expected_monthly_dividend}</td></tr>
          </table>
        `;

        const tbody = document.getElementById('analysis-table-body');
        if (!stats.holdings || stats.holdings.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7">No holdings found! check .app/portfolio.json</td></tr>';
          return;
        }

        tbody.innerHTML = stats.holdings.map(h => `
          <tr>
            <td>${h.symbol}</td>
            <td>${h.company}</td>
            <td>${h.shares}</td>
            <td>$${h.price}</td>
            <td>$${h.holding_value}</td>
            <td>$${h.yearly_dividend}</td>
            <td>${h.yield_1y}%</td>
          </tr>
        `).join('');
      } catch (err) {
        document.getElementById('analysis-summary').innerHTML = `<span style="color: red;">Error: ${err.message}</span>`;
        document.getElementById('analysis-table-body').innerHTML = `<tr><td colspan="7" style="color: red;">Failed to load portfolio analysis</td></tr>`;
      }
    }

    async function loadData() {
      try {
        const stats = await window.api.getStats();

        document.getElementById('stats-summary').innerHTML = `
          <table>
            <tr><td><strong>Database:</strong></td><td>${stats.db_path}</td></tr>
            <tr><td><strong>Size:</strong></td><td>${stats.file_size} bytes</td></tr>
            <tr><td><strong>Total Rows:</strong></td><td>${stats.total_rows}</td></tr>
            <tr><td><strong>Symbols Source:</strong></td><td>${stats.source} (${stats.rows.length} matching)</td></tr>
          </table>
        `;

        const theadTr = document.getElementById('table-header');
        const tbody = document.getElementById('table-body');

        if (stats.rows.length === 0) {
          theadTr.innerHTML = '<th>Symbol</th>';
          tbody.innerHTML = '<tr><td colspan="1">No matching rows found.</td></tr>';
          return;
        }

        const columns = Object.keys(stats.rows[0]);
        const colInfo = stats.col_info || {};
        theadTr.innerHTML = columns.map(col => {
          const desc = colInfo[col] || col;
          return `<th title="${desc}">${col}</th>`;
        }).join('');

        tbody.innerHTML = stats.rows.map(r => `
          <tr>
            ${columns.map(col => {
              const desc = colInfo[col] || '';
              return `<td title="${desc}">${r[col] !== null && r[col] !== undefined ? r[col] : ''}</td>`;
            }).join('')}
          </tr>
        `).join('');
      } catch (err) {
        document.getElementById('stats-summary').innerHTML = `<span style="color: red;">Error: ${err.message}</span>`;
        document.getElementById('table-body').innerHTML = `<tr><td colspan="1" style="color: red;">Failed to load data</td></tr>`;
      }
    }

    loadData();
  </script>
</body>
</html>
